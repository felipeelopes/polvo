[package]
name = "polvo"
version = "0.3.8"
description = "Polvo — run Claude Code, Codex, OpenCode and shells side by side on Windows"
authors = ["Polvo contributors"]
license = "MIT"
repository = "https://github.com/felipeelopes/polvo"
edition = "2021"
rust-version = "1.82"

[lib]
name = "polvo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
which = "7"
dirs = "6"
parking_lot = "0.12"
thiserror = "2"
log = "0.4"
trash = "5"
sys-locale = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider", "system-proxy"] }
tokio = { version = "1", features = ["time"] }
# Provedor de criptografia do TLS (o mesmo `ring` que o atualizador usa).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_System_Ole", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
